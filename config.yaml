service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [nop]
      processors: [batch]
      exporters: [nop]
  telemetry:
    resource:
      service.name: jaeger-query
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
extensions:
  # Without an explicit endpoint Jaeger 2.23 serves the health check on localhost only, where
  # the kubelet probes cannot reach it.
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
  jaeger_query:
    storage:
      traces: primary
    ui:
      config_file: /cmd/jaeger/config-ui.json
  jaeger_storage:
    backends:
      primary:
        elasticsearch:
          server_urls:
            - ${env:ES_SERVER_URL:-http://elasticsearch:9200}
receivers:
  nop:
processors:
  batch:
exporters:
  nop:

