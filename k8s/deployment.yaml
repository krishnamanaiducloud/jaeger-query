apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-query
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger-query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger-query
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger-query
          image: docker.io/mohankrishna999/jaeger-query:1.65.0.1-patched
          env:
            - name: SPAN_STORAGE_TYPE
              value: elasticsearch
          args:
            - --es.server-urls=http://elasticsearch:9200
          ports:
            - name: http
              containerPort: 16686
            - name: grpc
              containerPort: 16685
            - name: health
              containerPort: 16687
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

